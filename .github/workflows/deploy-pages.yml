name: 部署到 GitHub Pages

# 把中文文档站构建后发布到 GitHub Pages，用于在线预览。
# - 手动触发（workflow_dispatch）可选择是否跳过体量庞大的 API 参考，便于快速出预览。
# - 推送到当前工作分支时自动部署。
on:
  workflow_dispatch:
    inputs:
      skip_api:
        description: '跳过 api/ 参考页面（预览更快、产物更小）'
        type: boolean
        default: false
  push:
    branches:
      - arena/01a0f56b-avalonia-docs-zh

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，且不取消正在进行的部署，避免发布到一半被打断。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建站点产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 GitHub Pages（必要时自动启用）
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 计算站点地址与基路径
        run: |
          ORIGIN='${{ steps.pages.outputs.origin }}'
          BASE='${{ steps.pages.outputs.base_path }}'
          # 用户站点的 base_path 可能为空或 '/'，项目站点形如 '/avalonia-docs-zh'
          if [ -z "$BASE" ] || [ "$BASE" = "/" ]; then
            BASE='/'
          else
            BASE="${BASE%/}/"
          fi
          echo "DOCS_SITE_URL=$ORIGIN" >> "$GITHUB_ENV"
          echo "DOCS_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "站点地址：$ORIGIN"
          echo "基路径：$BASE"

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          DOCS_SKIP_API: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_api) && '1' || '0' }}
        run: npx docusaurus build

      - name: 产物自检
        run: |
          set -e
          test -f build/index.html
          test -f build/docs/welcome/index.html
          grep -q "欢迎" build/docs/welcome/index.html
          if [ "${{ (github.event_name == 'workflow_dispatch' && inputs.skip_api) && '1' || '0' }}" != "1" ]; then
            test -f build/api/avalonia/controls/button/index.html
            grep -q "命名空间" build/api/avalonia/controls/button/index.html
          fi
          echo "产物体积：$(du -sh build | cut -f1)"
          echo "页面数量：$(find build -name 'index.html' | wc -l)"
          {
            echo '## 部署产物'
            echo "- 站点地址：${DOCS_SITE_URL}${DOCS_BASE_URL#/}"
            echo "- 产物体积：$(du -sh build | cut -f1)"
            echo "- 页面数量：$(find build -name 'index.html' | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: 发布到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
